name: Build and release Kiosk Satellite plugin

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35"
      - name: Build plugin
        run: python3 tools/build.py --android-platform 35
      - uses: actions/upload-artifact@v4
        with:
          name: spectrum-visualizer-overlay
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: Create GitHub release when version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("kiosk-satellite-plugin.json"))["version"])')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then exit 0; fi
          gh release create "$TAG" dist/*.zip dist/*.zip.sha256 kiosk-satellite-plugin.json --target "$GITHUB_SHA" --title "Spectrum Visualizer Overlay $VERSION" --notes-file RELEASE_NOTES.md
